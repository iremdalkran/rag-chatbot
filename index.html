<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Doküman Chatbot</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<script>
  tailwind.config = { darkMode: 'class' };
</script>
<style>
  html { scroll-behavior: smooth; }
  body { font-family: system-ui, -apple-system, sans-serif; }
  #chat-box::-webkit-scrollbar { width: 6px; }
  #chat-box::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 999px; }
  .dark #chat-box::-webkit-scrollbar-thumb { background: #475569; }
  .spinner {
    display:inline-block; width:14px; height:14px;
    border:2px solid rgba(148,163,184,.4); border-top-color:#0ea5e9;
    border-radius:50%; animation:spin .7s linear infinite; margin-right:6px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .typing-dots { display:inline-flex; gap:4px; padding:12px 16px; }
  .typing-dots span {
    width:7px; height:7px; border-radius:50%;
    background:#94a3b8; animation:blink 1.4s infinite; animation-fill-mode:both;
  }
  .typing-dots span:nth-child(2) { animation-delay:.2s; }
  .typing-dots span:nth-child(3) { animation-delay:.4s; }
  @keyframes blink { 0%,80%,100% { opacity:.3; transform:scale(.85); } 40% { opacity:1; transform:scale(1); } }
</style>
</head>
<body class="h-full bg-slate-50 dark:bg-slate-900 transition-colors">

<div class="flex flex-col h-[100dvh] max-w-2xl mx-auto bg-white dark:bg-slate-800 shadow-sm transition-colors">

  <!-- Header -->
  <header class="flex items-center justify-between px-4 py-3 border-b border-slate-200 dark:border-slate-700 flex-shrink-0">
    <div class="flex items-center gap-2">
      <div class="w-8 h-8 rounded-lg bg-sky-500 flex items-center justify-center text-white">
        <i class="fa-solid fa-file-lines text-sm"></i>
      </div>
      <h1 class="font-semibold text-slate-800 dark:text-slate-100 text-sm sm:text-base">Doküman Chatbot</h1>
    </div>
    <button id="theme-toggle" aria-label="Tema değiştir"
      class="w-9 h-9 flex items-center justify-center rounded-full text-slate-500 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700">
      <i class="fa-solid fa-moon dark:hidden"></i>
      <i class="fa-solid fa-sun hidden dark:inline"></i>
    </button>
  </header>

  <!-- Upload bar: PDF -->
  <div class="px-4 py-3 border-b border-slate-200 dark:border-slate-700 flex-shrink-0">
    <div class="flex flex-col sm:flex-row gap-2">
      <label for="pdf-input"
        class="flex-1 flex items-center gap-2 border border-slate-300 dark:border-slate-600 rounded-lg px-3 py-2 text-sm text-slate-500 dark:text-slate-300 cursor-pointer truncate">
        <i class="fa-solid fa-file-pdf flex-shrink-0"></i>
        <span id="file-label-text" class="truncate">PDF seç...</span>
      </label>
      <input type="file" id="pdf-input" accept=".pdf" class="hidden">
      <button id="upload-btn" onclick="uploadPdf()"
        class="bg-sky-500 hover:bg-sky-600 disabled:opacity-50 disabled:cursor-not-allowed text-white text-sm font-medium px-4 py-2 rounded-lg transition-colors">
        Dokümanı Yükle
      </button>
    </div>
    <p id="upload-status" class="flex items-center mt-2 text-xs text-slate-500 dark:text-slate-400 min-h-[1em]"></p>
  </div>

  <!-- Upload bar: Excel -->
  <div class="px-4 py-3 border-b border-slate-200 dark:border-slate-700 flex-shrink-0">
    <div class="flex flex-col sm:flex-row gap-2">
      <label for="excel-input"
        class="flex-1 flex items-center gap-2 border border-slate-300 dark:border-slate-600 rounded-lg px-3 py-2 text-sm text-slate-500 dark:text-slate-300 cursor-pointer truncate">
        <i class="fa-solid fa-file-excel flex-shrink-0"></i>
        <span id="excel-label-text" class="truncate">Excel seç (.xlsx)...</span>
      </label>
      <input type="file" id="excel-input" accept=".xlsx,.xls" class="hidden">
      <button id="excel-upload-btn" onclick="uploadExcel()"
        class="bg-emerald-600 hover:bg-emerald-700 disabled:opacity-50 disabled:cursor-not-allowed text-white text-sm font-medium px-4 py-2 rounded-lg transition-colors">
        Excel Yükle
      </button>
    </div>
    <p id="excel-status" class="flex items-center mt-2 text-xs text-slate-500 dark:text-slate-400 min-h-[1em]"></p>
  </div>

  <!-- Messages -->
  <div id="chat-box" class="flex-1 overflow-y-auto px-4 py-4 flex flex-col gap-3"></div>

  <!-- Composer -->
  <div class="border-t border-slate-200 dark:border-slate-700 p-3 flex-shrink-0" style="padding-bottom: calc(0.75rem + env(safe-area-inset-bottom, 0px));">
    <div class="flex items-center gap-2 bg-slate-100 dark:bg-slate-700 rounded-full pl-4 pr-1.5 py-1.5">
      <input type="text" id="question-input" placeholder="Bir soru sor ya da 'grafik yap' de..."
        class="flex-1 bg-transparent outline-none text-sm text-slate-800 dark:text-slate-100 placeholder-slate-400 min-w-0">
      <button id="send-btn" onclick="sendQuestion()" aria-label="Gönder"
        class="w-9 h-9 flex-shrink-0 rounded-full bg-sky-500 hover:bg-sky-600 disabled:opacity-40 disabled:cursor-not-allowed text-white flex items-center justify-center transition-colors">
        <i class="fa-solid fa-paper-plane text-xs"></i>
      </button>
    </div>
  </div>

</div>

<script>
const API_URL = "https://rag-chatbot-lw84.onrender.com";

/* --- Tema (light/dark) --- */
const themeToggle = document.getElementById("theme-toggle");
function applyTheme(dark) {
  document.documentElement.classList.toggle("dark", dark);
  localStorage.setItem("theme", dark ? "dark" : "light");
}
const savedTheme = localStorage.getItem("theme");
const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
applyTheme(savedTheme ? savedTheme === "dark" : prefersDark);
themeToggle.addEventListener("click", () => {
  applyTheme(!document.documentElement.classList.contains("dark"));
});

/* --- PDF dosya seçimi --- */
document.getElementById("pdf-input").addEventListener("change", () => {
  const fileInput = document.getElementById("pdf-input");
  const labelText = document.getElementById("file-label-text");
  labelText.textContent = fileInput.files[0] ? fileInput.files[0].name : "PDF seç...";
});

/* --- Excel dosya seçimi --- */
document.getElementById("excel-input").addEventListener("change", () => {
  const fileInput = document.getElementById("excel-input");
  const labelText = document.getElementById("excel-label-text");
  labelText.textContent = fileInput.files[0] ? fileInput.files[0].name : "Excel seç (.xlsx)...";
});

/* --- PDF yükleme --- */
async function uploadPdf() {
  const fileInput = document.getElementById("pdf-input");
  const file = fileInput.files[0];
  const statusEl = document.getElementById("upload-status");
  const uploadBtn = document.getElementById("upload-btn");

  if (!file) {
    statusEl.textContent = "Önce bir dosya seç.";
    return;
  }

  statusEl.innerHTML = `<span class="spinner"></span> Yükleniyor...`;
  uploadBtn.disabled = true;

  const startTime = Date.now();
  const formData = new FormData();
  formData.append("file", file);

  try {
    const response = await fetch(`${API_URL}/upload`, { method: "POST", body: formData });
    const data = await response.json();
    const elapsed = Date.now() - startTime;
    if (elapsed < 600) await new Promise(r => setTimeout(r, 600 - elapsed));

    if (!response.ok) {
      statusEl.textContent = `Hata: ${data.detail}`;
      return;
    }
    statusEl.textContent = `Yüklendi: ${data.dosya}`;
  } catch (err) {
    statusEl.textContent = "Bağlantı hatası, tekrar deneyin.";
  } finally {
    uploadBtn.disabled = false;
  }
}

/* --- Excel yükleme --- */
async function uploadExcel() {
  const fileInput = document.getElementById("excel-input");
  const file = fileInput.files[0];
  const statusEl = document.getElementById("excel-status");
  const uploadBtn = document.getElementById("excel-upload-btn");

  if (!file) {
    statusEl.textContent = "Önce bir dosya seç.";
    return;
  }

  statusEl.innerHTML = `<span class="spinner"></span> Yükleniyor...`;
  uploadBtn.disabled = true;

  const startTime = Date.now();
  const formData = new FormData();
  formData.append("file", file);

  try {
    const response = await fetch(`${API_URL}/upload-excel`, { method: "POST", body: formData });
    const data = await response.json();
    const elapsed = Date.now() - startTime;
    if (elapsed < 600) await new Promise(r => setTimeout(r, 600 - elapsed));

    if (!response.ok) {
      statusEl.textContent = `Hata: ${data.detail}`;
      return;
    }
    statusEl.textContent = `Yüklendi: ${data.dosya} (${data.satir_sayisi} satır)`;
    addMessage(`Excel dosyası yüklendi. Artık "grafik yap" diyerek bu veriden grafik isteyebilirsin.`, "bot");
  } catch (err) {
    statusEl.textContent = "Bağlantı hatası, tekrar deneyin.";
  } finally {
    uploadBtn.disabled = false;
  }
}

/* --- Soru gönderme --- */
async function sendQuestion() {
  const input = document.getElementById("question-input");
  const sendBtn = document.getElementById("send-btn");
  const question = input.value.trim();
  if (!question) return;

  addMessage(question, "user");
  input.value = "";
  sendBtn.disabled = true;

  const typingEl = addTypingIndicator();
  const startTime = Date.now();

  try {
    const response = await fetch(`${API_URL}/chat`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ question }),
    });
    const data = await response.json();
    const elapsed = Date.now() - startTime;
    if (elapsed < 600) await new Promise(r => setTimeout(r, 600 - elapsed));

    typingEl.remove();

    if (!response.ok) {
      addMessage(`Hata: ${data.detail}`, "bot");
      return;
    }
    addMessage(data.answer, "bot", data.chart_base64);
  } catch (err) {
    typingEl.remove();
    addMessage("Bağlantı hatası, tekrar deneyin.", "bot");
  } finally {
    sendBtn.disabled = false;
  }
}

function addMessage(text, who, chartBase64) {
  const chatBox = document.getElementById("chat-box");
  const wrap = document.createElement("div");
  wrap.className = who === "user" ? "flex justify-end" : "flex justify-start";
  const bubble = document.createElement("div");
  bubble.className = who === "user"
    ? "max-w-[85%] bg-sky-500 text-white text-sm rounded-2xl rounded-br-md px-4 py-2.5 whitespace-pre-wrap break-words"
    : "max-w-[85%] bg-slate-100 dark:bg-slate-700 text-slate-800 dark:text-slate-100 text-sm rounded-2xl rounded-bl-md px-4 py-2.5 whitespace-pre-wrap break-words";
  bubble.textContent = text;

  if (chartBase64) {
    const img = document.createElement("img");
    img.src = `data:image/png;base64,${chartBase64}`;
    img.alt = "Oluşturulan grafik";
    img.className = "mt-2 rounded-lg max-w-full";
    bubble.appendChild(img);
  }

  wrap.appendChild(bubble);
  chatBox.appendChild(wrap);
  chatBox.scrollTop = chatBox.scrollHeight;
  return wrap;
}

function addTypingIndicator() {
  const chatBox = document.getElementById("chat-box");
  const wrap = document.createElement("div");
  wrap.className = "flex justify-start";
  wrap.innerHTML = `<div class="typing-dots bg-slate-100 dark:bg-slate-700 rounded-2xl rounded-bl-md"><span></span><span></span><span></span></div>`;
  chatBox.appendChild(wrap);
  chatBox.scrollTop = chatBox.scrollHeight;
  return wrap;
}

document.getElementById("question-input").addEventListener("keypress", (e) => {
  if (e.key === "Enter") sendQuestion();
});
</script>
</body>
</html>
