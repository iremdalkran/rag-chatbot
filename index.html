<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Doküman Chatbot</title>
  <style>
    body {
      font-family: sans-serif;
      max-width: 600px;
      margin: 40px auto;
      padding: 0 20px;
    }
    #chat-box {
      border: 1px solid #ccc;
      border-radius: 8px;
      height: 400px;
      overflow-y: auto;
      padding: 12px;
      margin-bottom: 12px;
    }
    .message {
      margin-bottom: 10px;
      padding: 8px 12px;
      border-radius: 8px;
      max-width: 80%;
    }
    .user-message {
      background: #daf1ff;
      margin-left: auto;
      text-align: right;
    }
    .bot-message {
      background: #f0f0f0;
    }
    #input-area {
      display: flex;
      gap: 8px;
    }
    #question-input {
      flex: 1;
      padding: 8px;
    }
  </style>
</head>
<body>

  <h2>Doküman Chatbot</h2>

  <div>
    <input type="file" id="pdf-input" accept=".pdf">
    <button onclick="uploadPdf()">Dokümanı Yükle</button>
    <p id="upload-status"></p>
  </div>

  <hr>

  <div id="chat-box"></div>

  <div id="input-area">
    <input type="text" id="question-input" placeholder="Bir soru sor...">
    <button onclick="sendQuestion()">Gönder</button>
  </div>

  <script>
    const API_URL = "https://rag-chatbot-lw84.onrender.com";

    async function uploadPdf() {
      const fileInput = document.getElementById("pdf-input");
      const file = fileInput.files[0];
      const statusEl = document.getElementById("upload-status");

      if (!file) {
        statusEl.textContent = "Önce bir dosya seç.";
        return;
      }

      statusEl.textContent = "Yükleniyor...";

      const formData = new FormData();
      formData.append("file", file);

      const response = await fetch(`${API_URL}/upload`, {
        method: "POST",
        body: formData,
      });

      const data = await response.json();

      if (!response.ok) {
        statusEl.textContent = `Hata: ${data.detail}`;
        return;
      }

      statusEl.textContent = `Yüklendi: ${data.dosya}`;
    }

    async function sendQuestion() {
      const input = document.getElementById("question-input");
      const question = input.value.trim();
      if (!question) return;

      addMessage(question, "user-message");
      input.value = "";

      const response = await fetch(`${API_URL}/chat`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ question: question }),
      });

      const data = await response.json();

      if (!response.ok) {
        addMessage(`Hata: ${data.detail}`, "bot-message");
        return;
      }

      addMessage(data.answer, "bot-message");
    }

    function addMessage(text, className) {
      const chatBox = document.getElementById("chat-box");
      const msgEl = document.createElement("div");
      msgEl.className = `message ${className}`;
      msgEl.textContent = text;
      chatBox.appendChild(msgEl);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    document.getElementById("question-input").addEventListener("keypress", (e) => {
      if (e.key === "Enter") sendQuestion();
    });
  </script>

</body>
</html>
