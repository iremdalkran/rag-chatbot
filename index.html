<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Doküman Chatbot</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<script>
  tailwind.config = { darkMode: 'class' };
</script>
<style>
  html { scroll-behavior: smooth; }
  body { font-family: system-ui, -apple-system, sans-serif; }
  #chat-box::-webkit-scrollbar { width: 6px; }
  #chat-box::-webkit-scrollbar-thumb { background: #d4d4d8; border-radius: 999px; }
  .dark #chat-box::-webkit-scrollbar-thumb { background: #52525b; }
  .spinner {
    display:inline-block; width:14px; height:14px;
    border:2px solid rgba(161,161,170,.4); border-top-color:#7c3aed;
    border-radius:50%; animation:spin .7s linear infinite; margin-right:6px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .typing-dots { display:inline-flex; gap:4px; padding:12px 16px; }
  .typing-dots span {
    width:7px; height:7px; border-radius:50%;
    background:#a1a1aa; animation:blink 1.4s infinite; animation-fill-mode:both;
  }
  .typing-dots span:nth-child(2) { animation-delay:.2s; }
  .typing-dots span:nth-child(3) { animation-delay:.4s; }
  @keyframes blink { 0%,80%,100% { opacity:.3; transform:scale(.85); } 40% { opacity:1; transform:scale(1); } }

  /* --- Sol menü (sohbet listesi) --- */
  .app-shell { display: flex; height: 100dvh; max-width: 1360px; margin: 0 auto; }
  .sidebar {
    width: 240px; flex-shrink: 0; background: #fafafa; border-right: 1px solid #e4e4e7;
    display: flex; flex-direction: column; padding: 12px; gap: 10px;
    transition: margin-left .2s ease;
  }
  .dark .sidebar { background: #18181b; border-color: #27272a; }
  .sidebar.hidden-mobile { margin-left: -240px; }
  .new-chat-btn {
    background: #18181b; color: #fff; border: none; border-radius: 8px;
    padding: 9px; font-size: 13px; cursor: pointer;
  }
  .dark .new-chat-btn { background: #a78bfa; color: #18181b; }
  .chat-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 2px; }
  .chat-list-item {
    font-size: 12.5px; padding: 8px 9px; border-radius: 7px; cursor: pointer;
    color: #3f3f46; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .dark .chat-list-item { color: #d4d4d8; }
  .chat-list-item:hover { background: #e4e4e7; }
  .dark .chat-list-item:hover { background: #27272a; }
  .chat-list-item.active {
    background: #ede9fe; color: #6d28d9; font-weight: 600;
    border-left: 3px solid #7c3aed; padding-left: 6px;
  }
  .dark .chat-list-item.active {
    background: #4c1d95; color: #c4b5fd; border-left: 3px solid #a78bfa; padding-left: 6px;
  }
  .sidebar-empty { font-size: 11.5px; color: #a1a1aa; padding: 8px; }
  .hamburger-btn { display: none; }
  @media (max-width: 640px) {
    .hamburger-btn { display: flex; }
    .sidebar { position: fixed; z-index: 30; left: 0; top: 0; bottom: 0; box-shadow: 2px 0 10px rgba(0,0,0,.15); }
    .sidebar.hidden-mobile { margin-left: -240px; box-shadow: none; }
  }

  /* --- Data RAG kartları (tablo / sql / grafik / öneriler) --- */
  .data-table-wrap { overflow-x: auto; max-width: 100%; }
  .result-card {
    border: 1px solid rgba(161,161,170,.35); border-radius: 12px; padding: 12px 14px;
    background: rgba(255,255,255,.5); box-shadow: 0 1px 2px rgba(0,0,0,.04);
  }
  .dark .result-card { background: rgba(15,23,42,.35); border-color: rgba(161,161,170,.2); }
  .data-table { border-collapse: collapse; font-size: 12px; width: 100%; }
  .data-table th, .data-table td {
    padding: 5px 8px; text-align: left; white-space: nowrap;
    border-bottom: 1px solid rgba(161,161,170,.35);
  }
  .data-table th { font-weight: 600; color: #71717a; }
  .dark .data-table th { color: #a1a1aa; }
  .sql-toggle-btn {
    font-size: 11px; color: #7c3aed; cursor: pointer; margin-top: 6px; display:inline-block;
  }
  .sql-block {
    display: none; background: #18181b; color: #d4d4d8; font-family: ui-monospace, monospace;
    font-size: 11px; padding: 8px 10px; border-radius: 8px; margin-top: 6px; white-space: pre-wrap;
  }
  .sql-block.open { display: block; }
  .suggestion-chip {
    display: flex; align-items: center; justify-content: space-between;
    width: 100%; text-align: left; font-size: 12.5px;
    background: rgba(255,255,255,.6); border: 1px solid rgba(161,161,170,.35);
    border-radius: 9px; padding: 9px 12px; margin-top: 6px; cursor: pointer;
    transition: background .12s ease, border-color .12s ease;
  }
  .dark .suggestion-chip { background: rgba(15,23,42,.4); border-color: rgba(161,161,170,.2); }
  .suggestion-chip:hover { background: rgba(124,58,237,.12); border-color: #a78bfa; }
  .suggestion-chip .arrow { color: #a1a1aa; font-size: 13px; margin-left: 10px; flex-shrink: 0; }

  /* --- Kart araç çubuğu (Panoya sabitle / CSV / PNG) --- */
  .card-toolbar {
    display: flex; align-items: center; justify-content: space-between;
    margin-top: 6px; margin-bottom: 2px;
  }
  .card-toolbar-title { font-size: 11px; color: #a1a1aa; font-weight: 600; }
  .card-toolbar-actions { display: flex; gap: 4px; }
  .card-btn {
    font-size: 10.5px; color: #52525b; background: rgba(161,161,170,.15);
    border: none; border-radius: 6px; padding: 3px 7px; cursor: pointer;
  }
  .dark .card-btn { color: #d4d4d8; background: rgba(161,161,170,.2); }
  .card-btn:hover { background: rgba(124,58,237,.2); color: #6d28d9; }
  .card-btn.copied { background: #22c55e; color: #fff; }
</style>
</head>
<body class="h-full bg-zinc-50 dark:bg-zinc-900 transition-colors">

<div class="app-shell">

  <!-- Sol menü: sohbet listesi -->
  <aside class="sidebar" id="sidebar">
    <button class="new-chat-btn" onclick="startNewChat()">+ Yeni sohbet</button>
    <div class="chat-list" id="chat-list">
      <div class="sidebar-empty">Henüz sohbet yok.</div>
    </div>
  </aside>

<div class="flex flex-col h-[100dvh] flex-1 min-w-0 bg-white dark:bg-zinc-800 shadow-sm transition-colors">

  <!-- Header -->
  <header class="flex items-center justify-between px-4 py-3 border-b border-zinc-200 dark:border-zinc-700 flex-shrink-0">
    <div class="flex items-center gap-2">
      <button id="hamburger-btn" onclick="toggleSidebar()" aria-label="Sohbet listesi"
        class="hamburger-btn w-8 h-8 items-center justify-center rounded-lg text-zinc-500 dark:text-zinc-300 hover:bg-zinc-100 dark:hover:bg-zinc-700">
        <i class="fa-solid fa-bars text-sm"></i>
      </button>
      <div class="w-8 h-8 rounded-lg bg-violet-600 flex items-center justify-center text-white">
        <i class="fa-solid fa-file-lines text-sm"></i>
      </div>
      <h1 class="font-semibold text-zinc-800 dark:text-zinc-100 text-sm sm:text-base">Doküman Chatbot</h1>
    </div>
    <button id="theme-toggle" aria-label="Tema değiştir"
      class="w-9 h-9 flex items-center justify-center rounded-full text-zinc-500 dark:text-zinc-300 hover:bg-zinc-100 dark:hover:bg-zinc-700">
      <i class="fa-solid fa-moon dark:hidden"></i>
      <i class="fa-solid fa-sun hidden dark:inline"></i>
    </button>
  </header>

  <!-- Upload bar: PDF -->
  <div class="px-4 py-3 border-b border-zinc-200 dark:border-zinc-700 flex-shrink-0">
    <div class="flex flex-col sm:flex-row gap-2">
      <label for="pdf-input"
        class="flex-1 flex items-center gap-2 border border-zinc-300 dark:border-zinc-600 rounded-lg px-3 py-2 text-sm text-zinc-500 dark:text-zinc-300 cursor-pointer truncate">
        <i class="fa-solid fa-file-pdf flex-shrink-0"></i>
        <span id="file-label-text" class="truncate">PDF seç...</span>
      </label>
      <input type="file" id="pdf-input" accept=".pdf" class="hidden">
      <button id="upload-btn" onclick="uploadPdf()"
        class="bg-violet-600 hover:bg-violet-700 disabled:opacity-50 disabled:cursor-not-allowed text-white text-sm font-medium px-4 py-2 rounded-lg transition-colors">
        Dokümanı Yükle
      </button>
    </div>
    <p id="upload-status" class="flex items-center mt-2 text-xs text-zinc-500 dark:text-zinc-400 min-h-[1em]"></p>
  </div>

  <!-- Upload bar: Excel / CSV -->
  <div class="px-4 py-3 border-b border-zinc-200 dark:border-zinc-700 flex-shrink-0">
    <div class="flex flex-col sm:flex-row gap-2">
      <label for="excel-input"
        class="flex-1 flex items-center gap-2 border border-zinc-300 dark:border-zinc-600 rounded-lg px-3 py-2 text-sm text-zinc-500 dark:text-zinc-300 cursor-pointer truncate">
        <i class="fa-solid fa-file-excel flex-shrink-0"></i>
        <span id="excel-label-text" class="truncate">Excel/CSV seç...</span>
      </label>
      <input type="file" id="excel-input" accept=".xlsx,.xls,.csv" class="hidden">
      <button id="excel-upload-btn" onclick="uploadExcel()"
        class="bg-emerald-600 hover:bg-emerald-700 disabled:opacity-50 disabled:cursor-not-allowed text-white text-sm font-medium px-4 py-2 rounded-lg transition-colors">
        Veri Yükle
      </button>
    </div>
    <p id="excel-status" class="flex items-center mt-2 text-xs text-zinc-500 dark:text-zinc-400 min-h-[1em]"></p>
  </div>

  <!-- Messages -->
  <div id="chat-box" class="flex-1 overflow-y-auto px-4 py-4 flex flex-col gap-3"></div>

  <!-- Composer -->
  <div class="border-t border-zinc-200 dark:border-zinc-700 p-3 flex-shrink-0" style="padding-bottom: calc(0.75rem + env(safe-area-inset-bottom, 0px));">
    <div class="flex items-center gap-2 bg-zinc-100 dark:bg-zinc-700 rounded-full pl-4 pr-1.5 py-1.5">
      <input type="text" id="question-input" placeholder="Bir soru sor..."
        class="flex-1 bg-transparent outline-none text-sm text-zinc-800 dark:text-zinc-100 placeholder-zinc-400 min-w-0">
      <button id="send-btn" onclick="sendQuestion()" aria-label="Gönder"
        class="w-9 h-9 flex-shrink-0 rounded-full bg-violet-600 hover:bg-violet-700 disabled:opacity-40 disabled:cursor-not-allowed text-white flex items-center justify-center transition-colors">
        <i class="fa-solid fa-paper-plane text-xs"></i>
      </button>
    </div>
  </div>

</div>
<!-- /ana sohbet paneli -->

</div>
<!-- /app-shell -->

<script>
const API_URL = "https://rag-chatbot-lw84.onrender.com";

// "Şu an hangi sohbetteyiz" bilgisini tutan durum (state) değişkeni.
// Sayfa ilk açıldığında henüz bir sohbet seçilmediği için null.
let currentChatId = null;

/* --- Sol menü aç/kapa (mobil) --- */
function toggleSidebar() {
  document.getElementById("sidebar").classList.toggle("hidden-mobile");
}
function closeSidebarOnMobile() {
  if (window.innerWidth <= 640) {
    document.getElementById("sidebar").classList.add("hidden-mobile");
  }
}
// Sayfa mobilde açılıyorsa menü başta kapalı başlasın
if (window.innerWidth <= 640) {
  document.getElementById("sidebar").classList.add("hidden-mobile");
}

/* --- Sohbet listesini backend'den çekip sol menüye basar --- */
async function loadChatList() {
  try {
    const res = await fetch(`${API_URL}/chats`);
    const chats = await res.json();
    renderChatList(chats);
  } catch (err) {
    console.error("Sohbet listesi alınamadı:", err);
  }
}

function renderChatList(chats) {
  const listEl = document.getElementById("chat-list");
  listEl.innerHTML = "";

  if (!chats || chats.length === 0) {
    listEl.innerHTML = `<div class="sidebar-empty">Henüz sohbet yok.</div>`;
    return;
  }

  chats.forEach(c => {
    const item = document.createElement("div");
    item.className = "chat-list-item" + (c.id === currentChatId ? " active" : "");
    item.textContent = c.title;
    item.onclick = () => selectChat(c.id);
    listEl.appendChild(item);
  });
}

/* --- Bir sohbete tıklanınca geçmişini yükler --- */
async function selectChat(chatId) {
  currentChatId = chatId;
  document.getElementById("chat-box").innerHTML = "";

  try {
    const res = await fetch(`${API_URL}/chats/${chatId}/messages`);
    const messages = await res.json();
    messages.forEach(m => {
      if (m.role === "user") {
        addMessage(m.content, "user");
      } else {
        // chat_store.py'den dönen mesaj şekli (table/sql/chart/suggestions)
        // addMessage'ın beklediği "data" objesiyle birebir aynı isimlere sahip.
        addMessage(m.content, "bot", m);
      }
    });
  } catch (err) {
    console.error("Sohbet geçmişi alınamadı:", err);
  }

  loadChatList(); // aktif sohbeti menüde vurgulamak için listeyi tazele
  closeSidebarOnMobile();
}

/* --- Yeni boş sohbet başlatır --- */
async function startNewChat() {
  try {
    const res = await fetch(`${API_URL}/chats`, { method: "POST" });
    const data = await res.json();
    currentChatId = data.id;
  } catch (err) {
    currentChatId = null; // olmazsa ilk soruda backend zaten otomatik yeni sohbet açacak
  }
  document.getElementById("chat-box").innerHTML = "";
  loadChatList();
  closeSidebarOnMobile();
}

// Sayfa ilk açıldığında sohbet listesini yükle
loadChatList();
let chartCounter = 0;

/* --- Tema (light/dark) --- */
const themeToggle = document.getElementById("theme-toggle");
function applyTheme(dark) {
  document.documentElement.classList.toggle("dark", dark);
  localStorage.setItem("theme", dark ? "dark" : "light");
}
const savedTheme = localStorage.getItem("theme");
const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
applyTheme(savedTheme ? savedTheme === "dark" : prefersDark);
themeToggle.addEventListener("click", () => {
  applyTheme(!document.documentElement.classList.contains("dark"));
});

/* --- PDF dosya seçimi --- */
document.getElementById("pdf-input").addEventListener("change", () => {
  const fileInput = document.getElementById("pdf-input");
  const labelText = document.getElementById("file-label-text");
  labelText.textContent = fileInput.files[0] ? fileInput.files[0].name : "PDF seç...";
});

/* --- Excel/CSV dosya seçimi --- */
document.getElementById("excel-input").addEventListener("change", () => {
  const fileInput = document.getElementById("excel-input");
  const labelText = document.getElementById("excel-label-text");
  labelText.textContent = fileInput.files[0] ? fileInput.files[0].name : "Excel/CSV seç...";
});

/* --- PDF yükleme --- */
async function uploadPdf() {
  const fileInput = document.getElementById("pdf-input");
  const file = fileInput.files[0];
  const statusEl = document.getElementById("upload-status");
  const uploadBtn = document.getElementById("upload-btn");

  if (!file) {
    statusEl.textContent = "Önce bir dosya seç.";
    return;
  }

  statusEl.innerHTML = `<span class="spinner"></span> Yükleniyor...`;
  uploadBtn.disabled = true;

  const startTime = Date.now();
  const formData = new FormData();
  formData.append("file", file);

  try {
    const response = await fetch(`${API_URL}/upload`, { method: "POST", body: formData });
    const data = await response.json();
    const elapsed = Date.now() - startTime;
    if (elapsed < 600) await new Promise(r => setTimeout(r, 600 - elapsed));

    if (!response.ok) {
      statusEl.textContent = `Hata: ${data.detail}`;
      return;
    }
    statusEl.textContent = `Yüklendi: ${data.dosya}`;
  } catch (err) {
    statusEl.textContent = "Bağlantı hatası, tekrar deneyin.";
  } finally {
    uploadBtn.disabled = false;
  }
}

/* --- Excel/CSV yükleme --- */
async function uploadExcel() {
  const fileInput = document.getElementById("excel-input");
  const file = fileInput.files[0];
  const statusEl = document.getElementById("excel-status");
  const uploadBtn = document.getElementById("excel-upload-btn");

  if (!file) {
    statusEl.textContent = "Önce bir dosya seç.";
    return;
  }

  statusEl.innerHTML = `<span class="spinner"></span> Yükleniyor...`;
  uploadBtn.disabled = true;

  const startTime = Date.now();
  const formData = new FormData();
  formData.append("file", file);

  try {
    const response = await fetch(`${API_URL}/upload-excel`, { method: "POST", body: formData });
    const data = await response.json();
    const elapsed = Date.now() - startTime;
    if (elapsed < 600) await new Promise(r => setTimeout(r, 600 - elapsed));

    if (!response.ok) {
      statusEl.textContent = `Hata: ${data.detail}`;
      return;
    }
    statusEl.textContent = `Yüklendi: ${data.dosya} (${data.satir_sayisi} satır)`;
    // Not: Artık anahtar kelimeyle ("grafik yap") tetiklenen tek bir statik grafik yok.
    // Her soru için Claude ilgili SQL'i üretip çalıştırıyor ve sonucu tablo + grafik olarak dönüyor.
    addMessage(`"${data.dosya}" yüklendi. Artık bu veriyle ilgili istediğin soruyu sorabilirsin, örn: "En çok satan 3 ürün hangisi?"`, "bot");
  } catch (err) {
    statusEl.textContent = "Bağlantı hatası, tekrar deneyin.";
  } finally {
    uploadBtn.disabled = false;
  }
}

/* --- Soru gönderme --- */
async function sendQuestion(overrideText) {
  const input = document.getElementById("question-input");
  const sendBtn = document.getElementById("send-btn");
  const question = (overrideText !== undefined ? overrideText : input.value).trim();
  if (!question) return;

  addMessage(question, "user");
  if (overrideText === undefined) input.value = "";
  sendBtn.disabled = true;

  const typingEl = addTypingIndicator();
  const startTime = Date.now();

  try {
    const response = await fetch(`${API_URL}/chat`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ question, chat_id: currentChatId }),
    });
    const data = await response.json();
    const elapsed = Date.now() - startTime;
    if (elapsed < 600) await new Promise(r => setTimeout(r, 600 - elapsed));

    typingEl.remove();

    if (!response.ok) {
      addMessage(`Hata: ${data.detail}`, "bot");
      return;
    }
    // Backend chat_id'yi döner (ilk soruda otomatik açılan sohbetin id'si budur)
    if (data.chat_id) {
      currentChatId = data.chat_id;
      loadChatList(); // yeni sohbet menüde görünsün / başlık güncellensin
    }
    addMessage(data.answer, "bot", data);
  } catch (err) {
    typingEl.remove();
    addMessage("Bağlantı hatası, tekrar deneyin.", "bot");
  } finally {
    sendBtn.disabled = false;
  }
}

function addMessage(text, who, data) {
  const chatBox = document.getElementById("chat-box");
  const wrap = document.createElement("div");
  wrap.className = who === "user" ? "flex justify-end" : "flex justify-start";
  const bubble = document.createElement("div");
  bubble.className = who === "user"
    ? "max-w-[85%] bg-violet-600 text-white text-sm rounded-2xl rounded-br-md px-4 py-2.5 whitespace-pre-wrap break-words"
    : "max-w-[95%] lg:max-w-[80%] bg-zinc-100 dark:bg-zinc-700 text-zinc-800 dark:text-zinc-100 text-sm rounded-2xl rounded-bl-md px-4 py-2.5 whitespace-pre-wrap break-words";
  bubble.textContent = text;

  if (data && data.table) bubble.appendChild(renderDataTable(data.table));
  if (data && data.sql) bubble.appendChild(renderSqlToggle(data.sql));
  if (data && data.chart) bubble.appendChild(renderChart(data.chart));
  if (data && data.suggestions && data.suggestions.length) bubble.appendChild(renderSuggestions(data.suggestions));

  wrap.appendChild(bubble);
  chatBox.appendChild(wrap);
  chatBox.scrollTop = chatBox.scrollHeight;
  return wrap;
}

function renderDataTable(table) {
  const wrap = document.createElement("div");
  wrap.className = "data-table-wrap result-card mt-2";

  const toolbar = document.createElement("div");
  toolbar.className = "card-toolbar";
  toolbar.innerHTML = `
    <span class="card-toolbar-title">📋 Sorgu Sonucu (${table.row_count} satır)</span>
    <span class="card-toolbar-actions">
      <button class="card-btn" data-action="copy">Panoya sabitle</button>
      <button class="card-btn" data-action="csv">CSV</button>
    </span>
  `;
  toolbar.querySelector('[data-action="copy"]').onclick = (e) => copyTableToClipboard(table, e.target);
  toolbar.querySelector('[data-action="csv"]').onclick = () => downloadTableCSV(table);
  wrap.appendChild(toolbar);

  const head = table.columns.map(c => `<th>${c}</th>`).join("");
  const rows = table.rows.map(r => `<tr>${r.map(v => `<td>${v === null ? "" : v}</td>`).join("")}</tr>`).join("");
  const tableEl = document.createElement("div");
  tableEl.innerHTML = `<table class="data-table"><thead><tr>${head}</tr></thead><tbody>${rows}</tbody></table>`;
  wrap.appendChild(tableEl);

  return wrap;
}

/* --- Tabloyu Excel'e yapıştırılabilir (TSV) formatta panoya kopyalar --- */
function tableToTSV(table) {
  const header = table.columns.join("\t");
  const rows = table.rows.map(r => r.map(v => v === null ? "" : v).join("\t"));
  return [header, ...rows].join("\n");
}

async function copyTableToClipboard(table, btn) {
  try {
    await navigator.clipboard.writeText(tableToTSV(table));
    flashButton(btn, "Kopyalandı ✓");
  } catch (err) {
    flashButton(btn, "Kopyalanamadı");
  }
}

/* --- Tabloyu .csv dosyası olarak indirir --- */
function downloadTableCSV(table) {
  const header = table.columns.join(",");
  const rows = table.rows.map(r =>
    r.map(v => {
      if (v === null) return "";
      const s = String(v);
      // İçinde virgül/tırnak/satır sonu varsa CSV kuralına göre tırnak içine al
      return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
    }).join(",")
  );
  const csv = [header, ...rows].join("\n");
  const blob = new Blob(["\uFEFF" + csv], { type: "text/csv;charset=utf-8;" }); // \uFEFF: Excel'de Türkçe karakterler bozulmasın diye
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "sorgu_sonucu.csv";
  a.click();
  URL.revokeObjectURL(url);
}

function flashButton(btn, text) {
  if (!btn) return;
  const original = btn.textContent;
  btn.textContent = text;
  btn.classList.add("copied");
  setTimeout(() => { btn.textContent = original; btn.classList.remove("copied"); }, 1500);
}

function renderSqlToggle(sql) {
  const id = `sql-${chartCounter++}`;
  const wrap = document.createElement("div");
  wrap.innerHTML = `
    <span class="sql-toggle-btn" onclick="document.getElementById('${id}').classList.toggle('open')">› Kullanılan SQL</span>
    <div class="sql-block" id="${id}"></div>
  `;
  // XSS'e karşı SQL metnini textContent ile yazıyoruz
  wrap.querySelector(".sql-block").textContent = sql;
  return wrap;
}

// Her canvas id'sine karşılık gelen Chart.js örneğini burada tutuyoruz —
// PNG indirirken/kopyalarken hangi grafiğin görselini alacağımızı bilmemiz lazım.
const chartInstances = {};

function renderChart(chart) {
  const id = `chart-${chartCounter++}`;
  const wrap = document.createElement("div");
  wrap.className = "result-card mt-2";

  const toolbar = document.createElement("div");
  toolbar.className = "card-toolbar";
  toolbar.innerHTML = `
    <span class="card-toolbar-title">📊 Grafik</span>
    <span class="card-toolbar-actions">
      <button class="card-btn" data-action="copy">Panoya sabitle</button>
      <button class="card-btn" data-action="png">PNG</button>
    </span>
  `;
  toolbar.querySelector('[data-action="copy"]').onclick = (e) => copyChartToClipboard(id, e.target);
  toolbar.querySelector('[data-action="png"]').onclick = () => downloadChartPNG(id);
  wrap.appendChild(toolbar);

  const canvasWrap = document.createElement("div");
  canvasWrap.innerHTML = `<canvas id="${id}" height="180"></canvas>`;
  wrap.appendChild(canvasWrap);

  const PIE_COLORS = ["#7c3aed","#f97316","#22c55e","#a855f7","#ef4444","#eab308","#14b8a6","#ec4899","#6366f1","#84cc16","#06b6d4","#f43f5e"];

  requestAnimationFrame(() => {
    const ctx = document.getElementById(id).getContext("2d");
    const isPie = chart.style === "pie";
    chartInstances[id] = new Chart(ctx, {
      type: isPie ? "pie" : chart.style,
      data: {
        labels: chart.x_labels,
        datasets: chart.series.map(s => ({
          label: s.name,
          data: s.values,
          backgroundColor: isPie ? PIE_COLORS.slice(0, s.values.length) : undefined,
        })),
      },
      options: { responsive: true, plugins: { legend: { position: "bottom", labels: { boxWidth: 10, font: { size: 10 } } } } },
    });
  });
  return wrap;
}

/* --- Grafiği .png dosyası olarak indirir --- */
function downloadChartPNG(chartId) {
  const chartObj = chartInstances[chartId];
  if (!chartObj) return;
  const a = document.createElement("a");
  a.href = chartObj.toBase64Image("image/png", 1);
  a.download = "grafik.png";
  a.click();
}

/* --- Grafiği görsel olarak panoya kopyalar (Excel/Word'e yapıştırılabilir) --- */
async function copyChartToClipboard(chartId, btn) {
  const chartObj = chartInstances[chartId];
  if (!chartObj) return;
  try {
    const canvas = chartObj.canvas;
    const blob = await new Promise(resolve => canvas.toBlob(resolve, "image/png"));
    await navigator.clipboard.write([new ClipboardItem({ "image/png": blob })]);
    flashButton(btn, "Kopyalandı ✓");
  } catch (err) {
    // Bazı tarayıcılar (özellikle file:// üzerinden açılan sayfalarda) görsel kopyalamaya izin vermez
    flashButton(btn, "Kopyalanamadı");
  }
}

function renderSuggestions(suggestions) {
  const wrap = document.createElement("div");
  wrap.className = "mt-1";
  suggestions.forEach(s => {
    const chip = document.createElement("button");
    chip.type = "button";
    chip.className = "suggestion-chip";

    const label = document.createElement("span");
    label.textContent = s;
    const arrow = document.createElement("span");
    arrow.className = "arrow";
    arrow.textContent = "→";

    chip.appendChild(label);
    chip.appendChild(arrow);
    chip.onclick = () => sendQuestion(s);
    wrap.appendChild(chip);
  });
  return wrap;
}

function addTypingIndicator() {
  const chatBox = document.getElementById("chat-box");
  const wrap = document.createElement("div");
  wrap.className = "flex justify-start";
  wrap.innerHTML = `<div class="typing-dots bg-zinc-100 dark:bg-zinc-700 rounded-2xl rounded-bl-md"><span></span><span></span><span></span></div>`;
  chatBox.appendChild(wrap);
  chatBox.scrollTop = chatBox.scrollHeight;
  return wrap;
}

document.getElementById("question-input").addEventListener("keypress", (e) => {
  if (e.key === "Enter") sendQuestion();
});
</script>
