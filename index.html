<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Doküman Chatbot</title>
  <style>
    body {
      font-family: sans-serif;
      max-width: 600px;
      margin: 40px auto;
      padding: 0 20px;
    }
    #chat-box {
      border: 1px solid #ccc;
      border-radius: 8px;
      height: 400px;
      overflow-y: auto;
      padding: 12px;
      margin-bottom: 12px;
    }
    .message {
      margin-bottom: 10px;
      padding: 8px 12px;
      border-radius: 8px;
      max-width: 80%;
    }
    .user-message {
      background: #daf1ff;
      margin-left: auto;
      text-align: right;
    }
    .bot-message {
      background: #f0f0f0;
    }
    #input-area {
      display: flex;
      gap: 8px;
    }
    #question-input {
      flex: 1;
      padding: 8px;
    }
    .spinner {
      display: inline-block;
      width: 14px;
      height: 14px;
      border: 2px solid #ccc;
      border-top-color: #555;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: middle;
      margin-right: 6px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    #upload-status {
      display: flex;
      align-items: center;
    }
    .typing-dots {
      display: inline-flex;
      gap: 4px;
      padding: 10px 14px;
    }
    .typing-dots span {
      width: 8px;
      height: 8px;
      background: #888;
      border-radius: 50%;
      animation: blink 1.4s infinite;
      animation-fill-mode: both;
    }
    .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
    .typing-dots span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes blink {
      0%, 80%, 100% { opacity: 0.2; transform: scale(0.8); }
      40% { opacity: 1; transform: scale(1); }
    }
    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
  </style>
</head>
<body>

  <h2>Doküman Chatbot</h2>

  <div>
    <input type="file" id="pdf-input" accept=".pdf">
    <button id="upload-btn" onclick="uploadPdf()">Dokümanı Yükle</button>
    <p id="upload-status"></p>
  </div>

  <hr>

  <div id="chat-box"></div>

  <div id="input-area">
    <input type="text" id="question-input" placeholder="Bir soru sor...">
    <button id="send-btn" onclick="sendQuestion()">Gönder</button>
  </div>

  <script>
    const API_URL = "https://rag-chatbot-lw84.onrender.com";

    async function uploadPdf() {
      const fileInput = document.getElementById("pdf-input");
      const file = fileInput.files[0];
      const statusEl = document.getElementById("upload-status");
      const uploadBtn = document.getElementById("upload-btn");

      if (!file) {
        statusEl.textContent = "Önce bir dosya seç.";
        return;
      }

      statusEl.innerHTML = `<span class="spinner"></span> Yükleniyor...`;
      uploadBtn.disabled = true;
      const startTime = Date.now();

      const formData = new FormData();
      formData.append("file", file);

      try {
        const response = await fetch(`${API_URL}/upload`, {
          method: "POST",
          body: formData,
        });

        const data = await response.json();

        const elapsed = Date.now() - startTime;
        if (elapsed < 600) {
          await new Promise((resolve) => setTimeout(resolve, 600 - elapsed));
        }

        if (!response.ok) {
          statusEl.textContent = `Hata: ${data.detail}`;
          return;
        }

        statusEl.textContent = `Yüklendi: ${data.dosya}`;
      } catch (err) {
        statusEl.textContent = "Bağlantı hatası, tekrar deneyin.";
      } finally {
        uploadBtn.disabled = false;
      }
    }

    async function sendQuestion() {
      const input = document.getElementById("question-input");
      const sendBtn = document.getElementById("send-btn");
      const question = input.value.trim();

      if (!question) {
        addMessage("Lütfen bir soru yazın.", "bot-message");
        return;
      }

      addMessage(question, "user-message");
      input.value = "";
      sendBtn.disabled = true;

      const typingEl = addTypingIndicator();
      const startTime = Date.now();

      try {
        const response = await fetch(`${API_URL}/chat`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ question: question }),
        });

        const data = await response.json();

        const elapsed = Date.now() - startTime;
        if (elapsed < 600) {
          await new Promise((resolve) => setTimeout(resolve, 600 - elapsed));
        }

        typingEl.remove();

        if (!response.ok) {
          addMessage(`Hata: ${data.detail}`, "bot-message");
          return;
        }

        addMessage(data.answer, "bot-message");
      } catch (err) {
        typingEl.remove();
        addMessage("Bağlantı hatası, tekrar deneyin.", "bot-message");
      } finally {
        sendBtn.disabled = false;
      }
    }

    function addMessage(text, className) {
      const chatBox = document.getElementById("chat-box");
      const msgEl = document.createElement("div");
      msgEl.className = `message ${className}`;
      msgEl.textContent = text;
      chatBox.appendChild(msgEl);
      chatBox.scrollTop = chatBox.scrollHeight;
      return msgEl;
    }

    function addTypingIndicator() {
      const chatBox = document.getElementById("chat-box");
      const msgEl = document.createElement("div");
      msgEl.className = "message bot-message typing-dots";
      msgEl.innerHTML = "<span></span><span></span><span></span>";
      chatBox.appendChild(msgEl);
      chatBox.scrollTop = chatBox.scrollHeight;
      return msgEl;
    }

    document.getElementById("question-input").addEventListener("keypress", (e) => {
      if (e.key === "Enter") sendQuestion();
    });
  </script>

</body>
</html>
